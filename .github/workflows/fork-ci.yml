name: Fork CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-race:
    name: targeted-race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test changed components with the race detector
        run: >-
          go test -race ./pkg/plugin ./pkg/util ./pkg/config
          ./pkg/monitor/nvidia/... ./pkg/vgpucache ./pkg/nodepodinformer
          ./cmd/vgpu ./cmd/vgpu-monitor
